name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Superseded PR runs are disposable; release runs must finish in order.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      # build already runs prepack; test that output instead of packaging it again.
      - run: pnpm test:package:built

  unit:
    name: Unit and component tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            projects: --project server --project client
          - name: events
            projects: --project events
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The runner image already has Chromium's libraries; --with-deps only adds fallback fonts.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm test:unit --run --no-file-parallelism ${{ matrix.projects }}

  e2e:
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The runner image already has Chromium's libraries; --with-deps only adds fallback fonts.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
